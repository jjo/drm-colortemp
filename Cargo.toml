[package]
name = "drm-colortemp-rs"
version = "2.0.0"
edition = "2021"
rust-version = "1.70"

[dependencies]
# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# DRM bindings (raw FFI)
libc = "0.2"

# Daemon dependencies
nix = { version = "0.27", features = ["signal", "fs", "ioctl", "poll", "process", "user"] }
inotify = "0.10"

# Local time conversion for time-based scheduling
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3.9"

[profile.release]
strip = true
lto = true
