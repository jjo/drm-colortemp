name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # The applet is a separate cargo project pinned to a libcosmic git rev, so it
  # gets its own job (and its own cache). `release` needs it: a broken applet
  # build must fail the release loudly rather than quietly ship without it.
  applet-deb:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo (applet)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          applet/target
        key: ${{ runner.os }}-applet-${{ hashFiles('applet/Cargo.lock') }}

    - name: Install applet build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config cmake dpkg-dev \
          libxkbcommon-dev libwayland-dev libudev-dev libssl-dev

    - name: Build applet deb
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        make applet-deb VERSION=${VERSION} REQUIRE_DERIVED=1
        ARCH=$(dpkg --print-architecture)
        sha256sum build-deb/drm-colortemp-cosmic-applet_${VERSION}_${ARCH}.deb \
          > build-deb/drm-colortemp-cosmic-applet_${VERSION}_${ARCH}.deb.sha256

    - name: Verify applet deb
      run: dpkg-deb --info build-deb/drm-colortemp-cosmic-applet_*.deb

    - name: Upload applet deb
      uses: actions/upload-artifact@v4
      with:
        name: drm-colortemp-cosmic-applet-deb
        path: |
          build-deb/drm-colortemp-cosmic-applet_*.deb
          build-deb/drm-colortemp-cosmic-applet_*.deb.sha256
        retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: applet-deb

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install OS deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libdrm-dev linux-libc-dev dpkg-dev

    - name: Build Rust binary
      run: make rust-build

    - name: Run tests
      run: make rust-test

    - name: Create release tarball
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        PACKAGE_NAME="drm-colortemp-${VERSION}"
        mkdir -p "${PACKAGE_NAME}"

        # Built Rust binary (consumers don't need to rebuild)
        cp target/release/drm-colortemp-rs "${PACKAGE_NAME}/drm-colortemp"

        # Source trees. `applet` is included so the AUR applet PKGBUILDs and
        # source installs can build from the release tarball.
        cp -r src src-c packaging "${PACKAGE_NAME}/"
        cp -r scripts "${PACKAGE_NAME}/"
        # Exclude the local build dir if the tarball is ever cut outside CI.
        tar c --exclude=target -C . applet | tar x -C "${PACKAGE_NAME}/"
        cp Cargo.toml Cargo.lock Makefile README.md NOTIFICATIONS.md CONTRIBUTING.md LICENSE "${PACKAGE_NAME}/"
        cp drm-colortemp.conf "${PACKAGE_NAME}/" || true

        tar czf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
        sha256sum "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"

    - name: Build deb package
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        make deb VERSION=${VERSION}
        ARCH=$(dpkg --print-architecture)
        sha256sum build-deb/drm-colortemp_${VERSION}_${ARCH}.deb \
          > build-deb/drm-colortemp_${VERSION}_${ARCH}.deb.sha256

    - name: Download applet deb
      uses: actions/download-artifact@v4
      with:
        name: drm-colortemp-cosmic-applet-deb
        path: build-deb/

    - name: Extract changelog section for this tag
      id: changelog
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        # Grab everything between `## [VERSION] - ...` and the next `## [`.
        # awk handles the case where the section is the last in the file.
        awk -v ver="$VERSION" '
          $0 ~ "^## \\[" ver "\\]" { capture=1; next }
          capture && /^## \[/      { capture=0 }
          capture                  { print }
        ' CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then
          echo "No CHANGELOG section found for v${VERSION}; falling back to git log." >&2
          {
            echo "## Changes"
            echo ""
            git log --pretty='- %s (%h)' "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD)..HEAD"
          } > release-notes.md
        fi
        cat >> release-notes.md <<'INSTALL'

        ## Installation

        ### Debian / Ubuntu

        ```bash
        sudo apt install ./drm-colortemp_*.deb
        sudo systemctl enable --now drm-colortemp

        # Optional: COSMIC panel applet (one-click Auto / Night / Day)
        sudo apt install ./drm-colortemp-cosmic-applet_*.deb
        ```

        ### Arch Linux (AUR)

        ```bash
        # Versioned package (release tarball)
        yay -S drm-colortemp
        # Or VCS package (tracks main)
        yay -S drm-colortemp-git

        # Optional: COSMIC panel applet
        yay -S cosmic-applet-colortemp
        ```

        ### From source

        ```bash
        tar xzf drm-colortemp-*.tar.gz
        cd drm-colortemp-*
        cargo build --release          # requires rustc >= 1.70
        sudo make rust-install
        ```

        ## Requirements

        - Linux with DRM/KMS support
        - For daemon mode: root + access to `/dev/dri/cardN`
        - For the COSMIC applet: membership in the `sudo` group on Debian/Ubuntu
          (`wheel` on Arch) — that is who its `/etc/sudoers.d` rule authorizes to
          run the VT-switch helper.
        INSTALL

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          drm-colortemp-*.tar.gz
          drm-colortemp-*.tar.gz.sha256
          build-deb/*.deb
          build-deb/*.deb.sha256
        body_path: release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
